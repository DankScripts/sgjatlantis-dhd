[[mods]]
modId="sgjadditions_capacity_patch"
version="${file.jarVersion}"
displayTest="MATCH_VERSION"
displayName="Stargate Atlantis DHD"
description='''
Standalone Atlantis DHD upgrade for SGJourney, including the accepted triangle dialer GUI, crystal interface, Pegasus shield support, and arbitrary-angle Blockbench model rendering.

Version 2.0.5 retains the installed 2.0.4 fixes and bundles the constructed Atlantis city from the world save, including underwater foundations and the Pegasus Stargate. It adds two independent jumper-bay ceiling hatches, a shared Atlantis-style control table with a two-door GUI and 50 FE operation cost, and optional direct redstone door control. The table, replacement hatch panels, and redstone ports have crafting recipes.

Config file: config/sgjatlantis-dhd.toml
'''

mixinConfigs="sgjadditions_capacity_patch.mixins.json"

[[dependencies.sgjadditions_capacity_patch]]
modId="forge"
mandatory=true
versionRange="[47.4.0,)"
ordering="NONE"
side="BOTH"

[[dependencies.sgjadditions_capacity_patch]]
modId="minecraft"
mandatory=true
versionRange="[1.20.1]"
ordering="NONE"
side="BOTH"

[[dependencies.sgjadditions_capacity_patch]]
