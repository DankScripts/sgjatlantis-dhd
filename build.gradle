            'tools/tests/PegasusShieldTransitionTest.java',
            'tools/tests/TransporterLevelsTest.java',
            'src/main/java/com/mustangdoc/sgjpatch/transporter/TransporterLevels.java',
            'src/main/java/com/mustangdoc/sgjpatch/client/render/PegasusShieldTransitionHelper.java',
            'src/main/java/com/mustangdoc/sgjpatch/compat/NativeDhdCenterAction.java',
            'src/main/java/com/mustangdoc/sgjpatch/client/util/AtlantisClipboardAddress.java',
            'src/main/java/com/mustangdoc/sgjpatch/city/CityDhdLinkPolicy.java',
            'src/main/java/com/mustangdoc/sgjpatch/standalone/AtlantisDialProgress.java')
