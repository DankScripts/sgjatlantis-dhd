tasks.register('verifyReleaseJar') {
    dependsOn 'releaseJar', 'verifyAtlantisDialProgress', 'verifyAtlantisClipboardAddress', 'verifyCityDhdLinkPolicy', 'verifyNativeDhdCenterAction'
    dependsOn 'verifyPegasusShieldTransition', 'verifyTransporterLevels', 'verifyClientDoorAnimation', 'verifyPowerRefresh', 'verifyAtlantisStructureMigration'
    doLast {
        def releaseFile = tasks.named('releaseJar', Jar).get().archiveFile.get().asFile
        def required = [
                'META-INF/mods.toml',
                'sgjadditions_capacity_patch.mixins.json',
                'com/mustangdoc/sgjpatch/SGJAdditionsCapacityPatch.class',
                'com/mustangdoc/sgjpatch/standalone/AtlantisBlockEntityDHD.class',
                'com/mustangdoc/sgjpatch/standalone/AtlantisPendingDial.class',
                'com/mustangdoc/sgjpatch/standalone/AtlantisDialProgress.class',
                'com/mustangdoc/sgjpatch/standalone/AtlantisDHDApi.class',
                'com/mustangdoc/sgjpatch/standalone/AtlantisDHDEntity.class',
                'com/mustangdoc/sgjpatch/client/util/LinkedMiniGate.class',
                'com/mustangdoc/sgjpatch/client/util/AtlantisClipboardAddress.class',
                'com/mustangdoc/sgjpatch/client/screens/AtlantisDHDScreenFixed.class'
        ]
        new java.util.zip.ZipFile(releaseFile).withCloseable { zip ->
            def missing = required.findAll { zip.getEntry(it) == null }
            if (!missing.isEmpty()) {
                throw new GradleException("Incomplete Forge release JAR: missing ${missing}")
            }
            def removedDhdMixins = [
                    'EnergyBlockEntityAccessor',
                    'AtlantisDhdDialCrystalGuardMixin',
                    'AtlantisDHDEntityEnergyCapabilityMixin',
                    'AtlantisDHDEntityCrystalValidationMixin',
                    'AtlantisDHDEntityDhdApiMixin',
                    'AtlantisDHDEntityCapacityMixin',
                    'AtlantisDHDConcealedCableBootstrapMixin'
            ]
            def mixinConfig = zip.getInputStream(zip.getEntry('sgjadditions_capacity_patch.mixins.json')).getText('UTF-8')
            def staleDhdMixins = removedDhdMixins.findAll { name ->
                mixinConfig.contains("\"${name}\"") ||
                        zip.getEntry("com/mustangdoc/sgjpatch/mixin/${name}.class") != null
            }
            if (!staleDhdMixins.isEmpty()) {
                throw new GradleException("Obsolete DHD mixins in release JAR: ${staleDhdMixins}")
            }
            def removedSelfMixins = [
                    'AtlantisJumperConfigBootstrapMixin',
                    'AtlantisDHDSneakUsePositionMixin',
                    'ServerboundToggleIrisLanteaMixin',
                    'client.AtlantisKeypadSurfaceMixin',
                    'client.AtlantisDHDConnectedSymbolLockMixin'
            ].findAll { name ->
                mixinConfig.contains("\"${name}\"") ||
                        zip.getEntry("com/mustangdoc/sgjpatch/mixin/${name.replace('.', '/')}.class") != null
            }
            if (!removedSelfMixins.isEmpty()) {
                throw new GradleException("Obsolete self-mixins in release JAR: ${removedSelfMixins}")
            }
            def dhdClass = zip.getInputStream(zip.getEntry('com/mustangdoc/sgjpatch/standalone/AtlantisDHDEntity.class')).bytes
            def dhdReferences = new String(dhdClass, 'ISO-8859-1')
            if (!dhdReferences.contains('AtlantisDHDConcealedCableBootstrapEvents') ||
                    !dhdReferences.contains('AtlantisBlockEntityDHD')) {
                throw new GradleException('Release does not contain the source-built Atlantis DHD')
            }
            def screenPrefix = 'com/mustangdoc/sgjpatch/client/screens/AtlantisDHDScreenFixed'
            def obsoleteScreenTypes = [
                    'net/povstalec/sgjourney/common/menu/AbstractDHDMenu',
                    'net/povstalec/sgjourney/client/widgets/dhd/DHDBigButton$Pegasus',
                    'com/mustangdoc/sgjpatch/compat/AtlantisShieldButtonHelper',
                    'com/mustangdoc/sgjpatch/compat/AtlantisShieldIndicatorHelper'
            ]
            def stale = zip.entries().findAll { it.name.startsWith(screenPrefix) && it.name.endsWith('.class') }
                    .findAll { entry ->
                        def contents = new String(zip.getInputStream(entry).bytes, 'ISO-8859-1')
                        obsoleteScreenTypes.any { contents.contains(it) }
                    }.collect { it.name }
            if (!stale.isEmpty()) {
                throw new GradleException("Obsolete SGJourney dialer references in release JAR: ${stale}")
            }
            if (zip.getEntry('com/mustangdoc/sgjpatch/compat/AtlantisShieldButtonHelper.class') != null) {
                throw new GradleException('Obsolete reflective Atlantis shield button helper in release JAR')
            }
            def coremod = zip.getEntry('coremods/sgjadditions_0650_compat.js')
            if (coremod == null) {
                throw new GradleException('Missing Atlantis compatibility transformer')
            }
            def script = zip.getInputStream(coremod).getText('UTF-8')
            def obsoleteTransforms = [
                    'guard_atlantis_engage_close',
                    'remap_accepted_atlantis_screen',
                    'remap_accepted_atlantis_symbol_button',
                    'remap_accepted_atlantis_center_button'
            ].findAll { script.contains("'${it}':") }
            if (!obsoleteTransforms.isEmpty()) {
                throw new GradleException("Obsolete Atlantis screen transformers registered: ${obsoleteTransforms}")
            }
            def helper = zip.getEntry('com/mustangdoc/sgjpatch/compat/AtlantisEngageCloseHelper.class')
            if (helper == null) {
                throw new GradleException('Missing Atlantis engage handler')
            }
            def javaHome = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }.get().metadata.installationPath.asFile
            def javap = new File(javaHome, "bin/javap${System.getProperty('os.name').toLowerCase().contains('windows') ? '.exe' : ''}")
            def disassembly = new ByteArrayOutputStream()
            exec {
                commandLine javap, '-classpath', releaseFile, '-c', '-p',
                        'com.mustangdoc.sgjpatch.compat.AtlantisEngageCloseHelper'
                standardOutput = disassembly
            }
            def bytecode = disassembly.toString('UTF-8')
            if (bytecode.contains('sgjpatch$closeAfterEngage') ||
                    bytecode.contains('String m_7379_') ||
                    bytecode.contains('net/minecraft/client/gui/screens/Screen.m_7379_')) {
                throw new GradleException('Atlantis engage handler still closes the screen on connect')
            }
        }
    }
}

tasks.register('sourceArchive', Zip) {
    archiveFileName = "sgjatlantis-dhd-1.20.1-${mod_version}-source.zip"
    destinationDirectory = layout.projectDirectory.dir('dist')
    from(layout.projectDirectory) {
        include 'src/**'
        include 'com/**'
        include 'blockbench/**'
        include 'tools/**'
        include 'gradle/**'
        include 'gradlew'
        include 'gradlew.bat'
        include 'build.gradle'
        include 'settings.gradle'
        include 'gradle.properties'
        include 'README.md'
        include 'README-BETA3.md'
        include 'README-2.0.5.md'
        include 'README-LANTEA-JUMPER.md'
        include 'README-BACKPLATE-UV.md'
        include 'README-CRYSTAL-HEIGHT.md'
        include 'README-SHIELD-FRAME.md'
        include 'README-TRIANGLE-UV.md'
        include 'BASELINE.md'
        include 'CHANGELOG.md'
        include 'LICENSE.txt'
        include '*-validation.json'
        include 'shield-frame-transfer-report.json'
        include 'baseline/README.txt'
        include 'baseline/2.0.5-after-moregates-removal/**'
        exclude 'tools/crossgate-audit/**'
        exclude '.gradle/**'
        exclude 'build/**'
        exclude 'dist/**'
        exclude 'tools/__pycache__/**'
        exclude 'tools/fonts/**'
        exclude 'run/**'
    }
}

tasks.register('release') {
    dependsOn 'verifyReleaseJar', 'sourceArchive'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
