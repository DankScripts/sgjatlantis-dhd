plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    // The ordinary jar contains only this source set. The public mod also needs
    // the frozen 2.0.5 baseline classes, which releaseJar merges in below.
    archivesName = 'sgjatlantis-dhd-1.20.1-classes-only'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods {
                sgjadditions_capacity_patch {
                    source sourceSets.main
                }
                stargate_atlantis {
                    source sourceSets.main
                }
            }
        }

        client {}

        server {
            args '--nogui'
        }
    }
}

repositories {
    maven { url = 'https://www.cursemaven.com' }
}

def namespaceResources = layout.buildDirectory.dir('generated/atlantisNamespaceResources')
tasks.register('generateAtlantisNamespaceResources', Sync) {
    into namespaceResources
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def legacy = 'sgjadditions_capacity_patch'
    inputs.files(fileTree("src/main/resources/assets/${legacy}/lang").matching { include '*.json' })
    from("src/main/resources/assets/${legacy}/blockstates") { into 'assets/stargate_atlantis/blockstates' }
    from("src/main/resources/assets/${legacy}/models/item") { into 'assets/stargate_atlantis/models/item' }
    from("src/main/resources/data/${legacy}/loot_tables") { into 'data/stargate_atlantis/loot_tables' }
    def baseline = zipTree('baseline/2.0.5-after-moregates-removal/sgjatlantis-dhd-1.20.1-2.0.5.jar')
    from(baseline) {
        include "assets/${legacy}/blockstates/**", "assets/${legacy}/models/item/**",
                "data/${legacy}/loot_tables/**"
        eachFile { details ->
            details.path = details.path.replace("assets/${legacy}/", 'assets/stargate_atlantis/')
                    .replace("data/${legacy}/", 'data/stargate_atlantis/')
        }
        includeEmptyDirs = false
    }
    doLast {
        fileTree("src/main/resources/assets/${legacy}/lang").matching { include '*.json' }.files.each { languageFile ->
            def translations = [:]
            new groovy.json.JsonSlurper().parse(languageFile, 'UTF-8').each { key, value ->
                ['block', 'item'].each { kind ->
                    def prefix = "${kind}.${legacy}."
                    if (key.startsWith(prefix))
                        translations["${kind}.stargate_atlantis.${key.substring(prefix.length())}"] = value
                }
            }
            def out = namespaceResources.get().file("assets/stargate_atlantis/lang/${languageFile.name}").asFile
            out.parentFile.mkdirs()
            out.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(translations)), 'UTF-8')
        }
    }
}
sourceSets.main.resources.srcDir(namespaceResources)
tasks.named('processResources') { dependsOn 'generateAtlantisNamespaceResources' }

dependencies {
    // Optional browser API only; JEI is not bundled or required at runtime.
    compileOnly files(System.getenv('JEI_JAR') ?: new File(System.getProperty('user.home'), 'curseforge/minecraft/Instances/All the Mods 9 - Stargates/mods/jei-1.20.1-forge-15.20.0.116.jar'))

    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly files('baseline/2.0.5-after-moregates-removal/sgjatlantis-dhd-1.20.1-2.0.5.jar')
    compileOnly files(System.getenv('LANTEA_JAR') ?: new File(System.getProperty('user.home'), 'curseforge/minecraft/Instances/All the Mods 9 - Stargates/mods/lantea-0.7.4.2+mc1.20.1.jar'))

    def configuredSgJourneyJar = System.getenv('SGJOURNEY_JAR')
    def sgJourneyJar = configuredSgJourneyJar != null && !configuredSgJourneyJar.isBlank()
            ? configuredSgJourneyJar
            : 'libs/Stargate.Journey-1.20.1-0.6.55-alpha.jar'
    compileOnly files(sgJourneyJar)
    testImplementation files(sgJourneyJar)
}

tasks.named('processResources', ProcessResources).configure {
    inputs.property 'mod_version', mod_version
    inputs.property 'file.jarVersion', mod_version
    filesMatching('META-INF/mods.toml') {
        expand([
                mod_version: mod_version,
                file: [jarVersion: mod_version]
        ])
    }
    filesMatching('data/**/tags/**/*.json') {
        filter { line -> line.replace('"sgjadditions_capacity_patch:', '"stargate_atlantis:') }
    }
}

tasks.named('jar', Jar).configure {
    from(layout.projectDirectory.dir('blockbench')) {
        into 'blockbench'
        include 'atlantis_dhd_table_original.bbmodel'
        include 'atlantis_dhd_table_shield_style.bbmodel'
    }
    manifest {
        attributes([
                'Specification-Title'      : 'sgjadditions_capacity_patch',
                'Specification-Vendor'     : 'DankScripts',
                'Specification-Version'    : '2',
                'Implementation-Title'     : 'Atlantis DHD Upgrade',
                'Implementation-Version'   : mod_version,
                'Implementation-Vendor'    : 'DankScripts',
                'MixinConfigs'             : 'sgjadditions_capacity_patch.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.register('releaseJar', Jar) {
    dependsOn 'reobfJar'
    archiveFileName = "sgjatlantis-dhd-1.20.1-${mod_version}.jar"
    destinationDirectory = layout.projectDirectory.dir('dist')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes([
                'Specification-Title'      : 'sgjadditions_capacity_patch',
                'Specification-Vendor'     : 'DankScripts',
                'Specification-Version'    : '2',
                'Implementation-Title'     : 'Atlantis DHD Upgrade',
                'Implementation-Version'   : mod_version,
                'Implementation-Vendor'    : 'DankScripts',
                'MixinConfigs'             : 'sgjadditions_capacity_patch.mixins.json'
        ])
    }

    // Current compiled classes must win over the accepted 2.0.5 baseline.
    from(zipTree(tasks.named('jar', Jar).flatMap { it.archiveFile }))
    from(zipTree(layout.projectDirectory.file('baseline/2.0.5-after-moregates-removal/sgjatlantis-dhd-1.20.1-2.0.5.jar'))) {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/mods.toml'
        exclude 'assets/sgjadditions_capacity_patch/lang/en_us.json'
        exclude 'pack.mcmeta'
        exclude 'sgjadditions_capacity_patch.mixins.json'
        exclude 'com/mustangdoc/sgjpatch/network/SGJPatchNetwork.class'
        exclude 'com/mustangdoc/sgjpatch/compat/AtlantisShieldButtonHelper.class'
        exclude 'com/mustangdoc/sgjpatch/mixin/EnergyBlockEntityAccessor.class'
        exclude 'com/mustangdoc/sgjpatch/mixin/AtlantisDhdDialCrystalGuardMixin.class'
        exclude 'com/mustangdoc/sgjpatch/mixin/AtlantisJumperConfigBootstrapMixin.class'
        exclude 'com/mustangdoc/sgjpatch/mixin/AtlantisDHDSneakUsePositionMixin.class'
        exclude 'com/mustangdoc/sgjpatch/mixin/ServerboundToggleIrisLanteaMixin.class'
        exclude 'com/mustangdoc/sgjpatch/mixin/client/AtlantisKeypadSurfaceMixin.class'
        exclude 'com/mustangdoc/sgjpatch/mixin/client/AtlantisDHDConnectedSymbolLockMixin.class'
        exclude 'com/mustangdoc/sgjpatch/mixin/AtlantisDHDEntityEnergyCapabilityMixin.class'
        exclude 'com/mustangdoc/sgjpatch/mixin/AtlantisDHDEntityCrystalValidationMixin.class'
        exclude 'com/mustangdoc/sgjpatch/mixin/AtlantisDHDEntityDhdApiMixin.class'
        exclude 'com/mustangdoc/sgjpatch/mixin/AtlantisDHDEntityCapacityMixin.class'
        exclude 'com/mustangdoc/sgjpatch/mixin/AtlantisDHDConcealedCableBootstrapMixin.class'
        exclude 'com/mustangdoc/sgjpatch/mixin/LargeNaquadahCableDHDPowerBridgeMixin.class'
        exclude 'com/mustangdoc/sgjpatch/compat/moregates/**'
        exclude 'data/moregates/**'
        exclude 'assets/sgjadditions/models/custom/atlantisdhd.json'
        exclude 'assets/sgjadditions/models/block/atlantisdhd.json'
        exclude 'assets/sgjadditions/models/block/atlantisdhd.json.textures'
        exclude 'assets/sgjadditions_capacity_patch/models/custom/atlantisdhd.json'
        exclude 'assets/sgjadditions_capacity_patch/models/block/atlantisdhd.json'
        exclude 'assets/sgjadditions_capacity_patch/models/block/atlantisdhd.json.textures'
        exclude 'resourcepacks/sgjatlantis_sgjadditions_override/assets/sgjadditions/models/custom/atlantisdhd.json'
    }
}

