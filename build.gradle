plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'sgjatlantis-dhd-1.20.1'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

def migratedRootSources = objects.sourceDirectorySet('migratedRootSources', 'SGJourney 0.6.50 migrated root sources')
migratedRootSources.srcDir(file('migration-src').isDirectory()
    ? layout.projectDirectory.dir('migration-src')
    : layout.projectDirectory.dir('../../src/main/java'))
migratedRootSources.include(
    'com/mustangdoc/sgjpatch/SGJAdditionsCapacityPatch.java',
    'com/mustangdoc/sgjpatch/menu/AtlantisDHDCompatMenu.java',
    'com/mustangdoc/sgjpatch/mixin/client/ClientPacketListenerOpenScreenMixin.java',
    'com/mustangdoc/sgjpatch/mixin/client/SGJourneyBigButtonIlluminationMixin.java')
sourceSets.main.java.source(migratedRootSources)

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods {
                sgjadditions_capacity_patch {
                    source sourceSets.main
                }
            }
        }

        client {}

        server {
            args '--nogui'
        }
    }
}

repositories {
    maven { url = 'https://www.cursemaven.com' }
    maven { url = 'https://maven.blamejared.com' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly files('baseline/2.0.2-beta.1/sgjatlantis-dhd-1.20.1-2.0.2-beta.1.jar')
    compileOnly fg.deobf(files('baseline/sgjadditions-1.1.0.jar'))
    compileOnly fg.deobf('mezz.jei:jei-1.20.1-common-api:15.20.0.116')
    compileOnly fg.deobf('mezz.jei:jei-1.20.1-forge-api:15.20.0.116')

    def configuredSgJourneyJar = System.getenv('SGJOURNEY_JAR')
    if (configuredSgJourneyJar != null && !configuredSgJourneyJar.isBlank()) {
        compileOnly files(configuredSgJourneyJar)
    } else {
        compileOnly fg.deobf("curse.maven:sgjourney-689083:${sgjourney_file_id}")
    }
}

tasks.named('processResources', ProcessResources).configure {
    inputs.property 'mod_version', mod_version
    filesMatching('META-INF/mods.toml') {
        expand mod_version: mod_version
    }
}

tasks.named('jar', Jar).configure {
    archiveClassifier = 'delta'
    from(layout.projectDirectory.dir('blockbench')) {
        into 'blockbench'
        include 'atlantis_dhd_table_original.bbmodel'
        include 'atlantis_dhd_table_shield_style.bbmodel'
    }
    manifest {
        attributes([
                'Specification-Title'      : 'sgjadditions_capacity_patch',
                'Specification-Vendor'     : 'DankScripts',
                'Specification-Version'    : '2',
                'Implementation-Title'     : 'Atlantis DHD Upgrade',
                'Implementation-Version'   : mod_version,
                'Implementation-Vendor'    : 'DankScripts',
                'MixinConfigs'             : 'sgjadditions_capacity_patch.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.register('releaseJar', Jar) {
    dependsOn 'reobfJar'
    archiveFileName = "sgjatlantis-dhd-1.20.1-${mod_version}.jar"
    destinationDirectory = layout.projectDirectory.dir('dist')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes([
                'Specification-Title'      : 'sgjadditions_capacity_patch',
                'Specification-Vendor'     : 'DankScripts',
                'Specification-Version'    : '2',
                'Implementation-Title'     : 'Atlantis DHD Upgrade',
                'Implementation-Version'   : mod_version,
                'Implementation-Vendor'    : 'DankScripts',
                'MixinConfigs'             : 'sgjadditions_capacity_patch.mixins.json'
        ])
    }

    from(zipTree(tasks.named('jar', Jar).flatMap { it.archiveFile })) {
        exclude 'com/struxnet/sgjadditions/**'
    }
    from(zipTree(layout.projectDirectory.file('baseline/accepted-balanced-bars/sgjatlantis-dhd-1.20.1-2.0.3-beta.3.jar'))) {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/mods.toml'
        exclude 'pack.mcmeta'
        exclude 'sgjadditions_capacity_patch.mixins.json'
        exclude 'com/mustangdoc/sgjpatch/network/SGJPatchNetwork.class'
        exclude 'assets/sgjadditions/models/custom/atlantisdhd.json'
        exclude 'assets/sgjadditions/models/block/atlantisdhd.json'
        exclude 'assets/sgjadditions/models/block/atlantisdhd.json.textures'
        exclude 'assets/sgjadditions_capacity_patch/models/custom/atlantisdhd.json'
        exclude 'assets/sgjadditions_capacity_patch/models/block/atlantisdhd.json'
        exclude 'assets/sgjadditions_capacity_patch/models/block/atlantisdhd.json.textures'
        exclude 'resourcepacks/sgjatlantis_sgjadditions_override/assets/sgjadditions/models/custom/atlantisdhd.json'
    }
}

tasks.register('verifySgJourney0650Compatibility') {
    dependsOn 'releaseJar'

    doLast {
        def jarFile = tasks.named('releaseJar', Jar).get().archiveFile.get().asFile
        def requiredEntries = [
            'com/mustangdoc/sgjpatch/block/AtlantisDHDBlock.class',
            'com/mustangdoc/sgjpatch/client/integration/SGJPatchJeiPlugin.class',
            'com/mustangdoc/sgjpatch/client/screens/AtlantisDHDScreenFixed.class',
            'com/mustangdoc/sgjpatch/client/widgets/AtlantisPegasusBigButton.class',
            'com/mustangdoc/sgjpatch/mixin/AbstractDHDMenuLegacyActionsMixin.class',
            'com/mustangdoc/sgjpatch/mixin/client/ClientPacketListenerOpenScreenMixin.class',
            'com/mustangdoc/sgjpatch/mixin/client/AtlantisDHDConnectedSymbolLockMixin.class',
            'assets/sgjpatch/textures/gui/atlantis_dhd_clean.png',
            'META-INF/coremods.json',
            'coremods/sgjadditions_0650_compat.js'
        ]

        new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
            requiredEntries.each { entryName ->
                if (zip.getEntry(entryName) == null) {
                    throw new GradleException("${jarFile.name} is missing compatibility class ${entryName}")
                }
            }
            def foreignClasses = zip.entries().findAll {
                !it.directory && it.name.startsWith('com/struxnet/sgjadditions/') && it.name.endsWith('.class')
            }*.name
            if (!foreignClasses.isEmpty()) {
                throw new GradleException("${jarFile.name} contains classes owned by SGJourney Additions: ${foreignClasses}")
            }
            def splitPackageClasses = zip.entries().findAll {
                !it.directory && it.name.startsWith('net/povstalec/sgjourney/') && it.name.endsWith('.class')
            }*.name
            if (!splitPackageClasses.isEmpty()) {
                throw new GradleException("${jarFile.name} contains split-package SGJourney classes: ${splitPackageClasses}")
            }

            def screenEntry = zip.getEntry('com/mustangdoc/sgjpatch/client/screens/AtlantisDHDScreenFixed.class')
            def screenConstants = zip.getInputStream(screenEntry).getText('ISO-8859-1')
            if (!screenConstants.contains('atlantis_dhd_clean.png')) {
                throw new GradleException('AtlantisDHDScreenFixed is missing the accepted UI background')
            }
            if (screenConstants.contains('atlantis_dhd_crystal_outer_green')) {
                throw new GradleException('AtlantisDHDScreenFixed was replaced by the rejected UI rewrite')
            }

            def baselineFile = layout.projectDirectory.file(
                    'baseline/accepted-balanced-bars/sgjatlantis-dhd-1.20.1-2.0.3-beta.3.jar').asFile
            new java.util.zip.ZipFile(baselineFile).withCloseable { baselineZip ->
                def screenPrefix = 'com/mustangdoc/sgjpatch/client/screens/AtlantisDHDScreenFixed'
                def acceptedScreenEntries = baselineZip.entries().findAll {
                    !it.directory && it.name.startsWith(screenPrefix) && it.name.endsWith('.class')
                }*.name
                acceptedScreenEntries.each { entryName ->
                    def acceptedBytes = baselineZip.getInputStream(baselineZip.getEntry(entryName)).bytes
                    def releaseBytes = zip.getInputStream(zip.getEntry(entryName)).bytes
                    if (!java.util.Arrays.equals(acceptedBytes, releaseBytes)) {
                        throw new GradleException("Accepted Atlantis UI bytecode changed: ${entryName}")
                    }
                }
            }
        }
    }
}

tasks.register('sourceArchive', Zip) {
    archiveFileName = "sgjatlantis-dhd-1.20.1-${mod_version}-source.zip"
    destinationDirectory = layout.projectDirectory.dir('dist')
    from(migratedRootSources) { into 'migration-src' }
    from(layout.projectDirectory) {
        include 'src/**'
        include 'com/**'
        include 'blockbench/**'
        include 'tools/**'
        include 'gradle/**'
        include 'gradlew'
        include 'gradlew.bat'
        include 'build.gradle'
        include 'settings.gradle'
        include 'gradle.properties'
        include 'README.md'
        include 'README-ALMOSTFLUIDIFIED.md'
        include 'README-BETA3.md'
        include 'README-BACKPLATE-UV.md'
        include 'README-CRYSTAL-HEIGHT.md'
        include 'README-SHIELD-FRAME.md'
        include 'README-TRIANGLE-UV.md'
        include 'BASELINE.md'
        include 'CHANGELOG.md'
        include 'LICENSE.txt'
        include '*-validation.json'
        include 'shield-frame-transfer-report.json'
        include 'baseline/README.txt'
        include 'baseline/sgjadditions-1.1.0.jar'
        include 'baseline/sgjatlantis-dhd-1.20.1-2.0.0-beta.1.jar'
        include 'baseline/2.0.2-beta.1/**'
        include 'baseline/accepted-gui-r13/**'
        include 'baseline/accepted-balanced-bars/**'
        include 'baseline/confirmed-working-r17b/**'
        exclude '.gradle/**'
        exclude 'build/**'
        exclude 'dist/**'
        exclude 'run/**'
    }
}

tasks.register('release') {
    dependsOn 'verifySgJourney0650Compatibility', 'sourceArchive'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
