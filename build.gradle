plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.106'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "sgjatlantis-dhd-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

tasks.named('jar', Jar).configure {
    manifest {
        attributes(
                'Implementation-Title': mod_name,
                'Implementation-Version': mod_version,
                'Implementation-Vendor': mod_authors
        )
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

neoForge {
    version = neo_version

    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_mappings_version
    }

    runs {
        client { client() }
        server { server() }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        stargate_atlantis {
            sourceSet(sourceSets.main)
        }
    }
}

def namespaceResources = layout.buildDirectory.dir('generated/atlantisNamespaceResources')
tasks.register('generateAtlantisNamespaceResources', Sync) {
    into namespaceResources
    duplicatesStrategy = DuplicatesStrategy.FAIL
    ['sgjadditions_capacity_patch', 'sgjatlantis_dhd'].each { legacy ->
        inputs.files(fileTree("src/main/resources/assets/${legacy}/lang").matching { include '*.json' })
        from("src/main/resources/assets/${legacy}/blockstates") { into 'assets/stargate_atlantis/blockstates' }
        from("src/main/resources/assets/${legacy}/models/item") { into 'assets/stargate_atlantis/models/item' }
        from("src/main/resources/data/${legacy}/loot_table") { into 'data/stargate_atlantis/loot_table' }
    }
    doLast {
        def translations = [:]
        ['sgjadditions_capacity_patch', 'sgjatlantis_dhd'].each { legacy ->
            fileTree("src/main/resources/assets/${legacy}/lang").matching { include '*.json' }.files.each { languageFile ->
                def target = translations.computeIfAbsent(languageFile.name) { [:] }
                new groovy.json.JsonSlurper().parse(languageFile, 'UTF-8').each { key, value ->
                    ['block', 'item'].each { kind ->
                        def prefix = "${kind}.${legacy}."
                        if (key.startsWith(prefix)) {
                            def newKey = "${kind}.stargate_atlantis.${key.substring(prefix.length())}"
                            if (target.containsKey(newKey) && target[newKey] != value)
                                throw new GradleException("Conflicting translation ${newKey} in ${languageFile.name}")
                            target[newKey] = value
                        }
                    }
                }
            }
        }
        translations.each { name, values ->
            def out = namespaceResources.get().file("assets/stargate_atlantis/lang/${name}").asFile
            out.parentFile.mkdirs()
            out.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(values)), 'UTF-8')
        }
    }
}
sourceSets.main.resources.srcDir(namespaceResources)
tasks.named('processResources') { dependsOn 'generateAtlantisNamespaceResources' }

dependencies {
    // Optional browser API only; JEI is not bundled or required at runtime.
    compileOnly files(System.getenv('JEI_JAR') ?: new File(System.getProperty('user.home'), 'curseforge/minecraft/Instances/NeoForge/mods/jei-1.21.1-neoforge-19.27.0.336.jar'))

    // Compile against the release API. Third-party JARs are not redistributed.
    def configuredSgJourneyJar = System.getenv('SGJOURNEY_JAR')
    implementation files(configuredSgJourneyJar != null && !configuredSgJourneyJar.isBlank()
            ? configuredSgJourneyJar
            : 'libs/Stargate.Journey-1.21.1-0.6.55-alpha.jar')
    def lanteaJar = file(System.getenv('LANTEA_JAR') ?: 'libs/lantea-0.7.3.0+mc1.21.1.jar')
    if (!lanteaJar.isFile()) throw new GradleException("Set LANTEA_JAR to an existing NeoForge Lantea JAR: ${lanteaJar}")
    compileOnly files(lanteaJar)
    testRuntimeOnly files(lanteaJar)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('sourceArchive', Zip) {
    archiveFileName = "sgjatlantis-dhd-${minecraft_version}-${mod_version}-source.zip"
    destinationDirectory = layout.projectDirectory.dir('dist')
    from(projectDir) {
        include 'src/**', 'gradle/**', 'gradlew', 'gradlew.bat', 'build.gradle',
                'settings.gradle', 'gradle.properties', 'README.md', 'CHANGELOG.md',
                'BUILDING.md', 'PORT_STATUS.md', 'LICENSE.txt', 'BASELINE.md',
                'baseline/2.0.5-current/**', 'tools/**'
    }
}

tasks.register('releaseJar', Copy) {
    dependsOn 'build'
    from(tasks.named('jar'))
    into(layout.projectDirectory.dir('dist'))
}

tasks.register('release') { dependsOn 'releaseJar', 'sourceArchive', 'verifyPort' }

// Runs without starting Minecraft or touching a player's saves.
tasks.register('verifyPort', JavaExec) {
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    dependsOn 'testClasses'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.mustangdoc.sgjpatch.PortChecks'
}
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath


