plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.106'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "sgjatlantis-dhd-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

neoForge {
    version = neo_version

    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_mappings_version
    }

    runs {
        client { client() }
        server { server() }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    implementation 'curse.maven:sgjourney-689083:9050700'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('sourceArchive', Zip) {
    archiveFileName = "sgjatlantis-dhd-${minecraft_version}-${mod_version}-source.zip"
    destinationDirectory = layout.projectDirectory.dir('dist')
    from(projectDir) {
        include 'src/**', 'gradle/**', 'gradlew', 'gradlew.bat', 'build.gradle',
                'settings.gradle', 'gradle.properties', 'README.md', 'CHANGELOG.md',
                'BUILDING.md', 'PORT_STATUS.md', 'LICENSE.txt'
    }
}

tasks.register('releaseJar', Copy) {
    dependsOn 'build'
    from(tasks.named('jar'))
    into(layout.projectDirectory.dir('dist'))
}

tasks.register('release') { dependsOn 'releaseJar', 'sourceArchive' }
